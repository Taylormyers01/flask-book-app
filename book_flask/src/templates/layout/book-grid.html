<style>
    .page-item.active .page-link {
        background-color: var(--bs-secondary) !important;
        border-color: var(--bs-secondary) !important;
        color: var(--bs-white) !important;
    }

    .page-link {
        color: var(--bs-secondary);
    }

    .page-link:hover {
        color: var(--bs-white);
        background-color: var(--bs-secondary);
        border-color: var(--bs-secondary);
    }

</style>
<div class="d-flex flex-column" style="height: 100%;">

    <div class="flex-grow overflow-auto overflow-x-hidden">
        <div class="row g-3">
            {% for v_book in books %}
                <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                    {% include "content/book-card.html" %}
                </div>
            {% endfor %}
        </div>
    </div>

    {% if next_page is defined %}
        <div class="d-flex justify-content-center py-2">
            <nav>
                <ul class="pagination mb-0">
                    {% for p in range(next_page - 3, next_page + 2) %}
                        {% if 1 <= p < max_pages %}
                            <li class="page-item {% if p == next_page - 1 %}active{% endif %}">
                                <a class="page-link" href="#" onclick="loadAndSearch({{ p }})">
                                    {{ p }}
                                </a>
                            </li>
                        {% endif %}
                    {% endfor %}
                </ul>
            </nav>
        </div>
    {% endif %}

</div>
